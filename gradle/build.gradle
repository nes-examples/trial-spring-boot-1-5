buildscript {
	repositories {
		maven {
			url = uri(project.property('herodevs_nes_registry_url'))
			credentials {
				username = project.property('herodevs_nes_registry_user')
			}
		}
		mavenCentral()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:1.5.22-spring-boot-1.5.24-trial")
	}
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'application'
apply plugin: 'java'
apply plugin: 'org.springframework.boot'


group = 'com.herodevs.nes.trial.spring'
version = '0.0.1-SNAPSHOT'

repositories {
	maven {
		url = uri(project.property('herodevs_nes_registry_url'))
		credentials {
			username = project.property('herodevs_nes_registry_user')
		}
	}
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}
